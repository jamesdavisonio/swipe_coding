name: Bug report
description: Something is broken. Give enough for someone to reproduce it.
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: One paragraph — observable behaviour, not diagnosis.
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Minimal steps. Which surface (phone, agent, session), inputs, versions.
      placeholder: |
        1. …
        2. …
    validations: { required: true }
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: agent.log lines, screenshots, task id, request_id. Verbatim beats paraphrase.
