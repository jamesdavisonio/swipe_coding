<title>Swipe Deck Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one full-height phone column. Top bar (count, listen), the card stage, the mic dock. Sheets slide in from top (overview) and bottom (details, choices). */
:root{
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;

  --bg:#EEF0F3; --fg:#14171C; --muted:#5C6470; --surface:#FFFFFF; --line:#D9DDE3;
  --yes:#127A45; --later:#4A5361; --stamp-bg:#FFFFFF; --mic:#14171C; --mic-ink:#FFFFFF; --rec:#D23B2A;
  --shadow:0 18px 40px -18px rgba(20,23,28,.35), 0 2px 6px rgba(20,23,28,.08);

  --decision-bg:#D6E3F8; --decision-ink:#0F2240;
  --round-bg:#E3DAF7;    --round-ink:#23123F;
  --important-bg:#F39A3D;--important-ink:#2A1300;
  --todo-bg:#F5EBB0;     --todo-ink:#2D2500;
  --stopped-bg:#F4CFCA;  --stopped-ink:#3D0F0B;
  --summary-bg:#E3E3DF;  --summary-ink:#24241F;
  --next-bg:#D5ECDC;     --next-ink:#0D2A16;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D0F13; --fg:#ECEEF2; --muted:#9AA3AF; --surface:#1A1D23; --line:#2C313A;
  --yes:#4CD08A; --later:#B7C0CC; --stamp-bg:#0D0F13; --mic:#ECEEF2; --mic-ink:#0D0F13; --rec:#FF6B5A;
  --shadow:0 18px 40px -18px rgba(0,0,0,.8), 0 2px 6px rgba(0,0,0,.4);
  --decision-bg:#1B2B47; --decision-ink:#DCE7FA;
  --round-bg:#2B2245;    --round-ink:#E8DFFB;
  --important-bg:#C2610F;--important-ink:#FFF3E6;
  --todo-bg:#3A3315;     --todo-ink:#F5EBB0;
  --stopped-bg:#47201C;  --stopped-ink:#F8DAD6;
  --summary-bg:#26272A;  --summary-ink:#E3E3DF;
  --next-bg:#16331F;     --next-ink:#D3EEDB;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D0F13; --fg:#ECEEF2; --muted:#9AA3AF; --surface:#1A1D23; --line:#2C313A;
  --yes:#4CD08A; --later:#B7C0CC; --stamp-bg:#0D0F13; --mic:#ECEEF2; --mic-ink:#0D0F13; --rec:#FF6B5A;
  --shadow:0 18px 40px -18px rgba(0,0,0,.8), 0 2px 6px rgba(0,0,0,.4);
  --decision-bg:#1B2B47; --decision-ink:#DCE7FA;
  --round-bg:#2B2245;    --round-ink:#E8DFFB;
  --important-bg:#C2610F;--important-ink:#FFF3E6;
  --todo-bg:#3A3315;     --todo-ink:#F5EBB0;
  --stopped-bg:#47201C;  --stopped-ink:#F8DAD6;
  --summary-bg:#26272A;  --summary-ink:#E3E3DF;
  --next-bg:#16331F;     --next-ink:#D3EEDB;
  color-scheme:dark;
}
html,body{height:100%;overscroll-behavior:none}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yes);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 10px}
.count{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  font-weight:600;font-variant-numeric:tabular-nums;cursor:pointer}
.count svg{width:16px;height:16px;opacity:.7}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:20px;height:20px}
.iconbtn[aria-pressed="true"]{background:var(--fg);color:var(--bg)}

.banner{margin:0 0 10px;padding:10px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;display:flex;gap:10px;align-items:center}
.banner .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.banner.wait .dot{animation:pulse 1.2s infinite}
.banner.ok .dot{background:var(--yes)}
@keyframes pulse{50%{opacity:.25}}

/* stage + cards */
.stage{flex:1;position:relative;min-height:0;touch-action:none}
.card{position:absolute;inset:0;border-radius:28px;padding:20px 22px 16px;display:flex;flex-direction:column;
  background:var(--c-bg);color:var(--c-ink);box-shadow:var(--shadow);user-select:none;-webkit-user-select:none;will-change:transform;overflow:hidden}
.card.back{transform:scale(.94) translateY(16px);filter:saturate(.8) brightness(.97)}
.card.enter{animation:enter .22s ease-out}
@keyframes enter{from{transform:scale(.94) translateY(16px)}to{transform:none}}
.t-decision{--c-bg:var(--decision-bg);--c-ink:var(--decision-ink)}
.t-round{--c-bg:var(--round-bg);--c-ink:var(--round-ink)}
.t-important{--c-bg:var(--important-bg);--c-ink:var(--important-ink)}
.t-todo{--c-bg:var(--todo-bg);--c-ink:var(--todo-ink)}
.t-stopped{--c-bg:var(--stopped-bg);--c-ink:var(--stopped-ink)}
.t-summary{--c-bg:var(--summary-bg);--c-ink:var(--summary-ink)}
.t-next{--c-bg:var(--next-bg);--c-ink:var(--next-ink)}

.c-meta{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.c-meta .ago{letter-spacing:.02em;text-transform:none;font-weight:500;opacity:.75}
.c-who{margin-top:8px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-size:15px;font-weight:600}
.c-who .folder{font-family:var(--mono);font-size:12.5px;font-weight:400;opacity:.75}
.c-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;border:1.5px solid currentColor;opacity:.85}
.c-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;min-height:0;padding-block:12px}
.c-head{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(27px, 7.6vw, 36px);line-height:1.08;letter-spacing:-.015em;text-wrap:balance}
.c-then{margin:0;font-size:16px;line-height:1.4;opacity:.85;text-wrap:pretty}
.c-opts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.c-opts li{padding:10px 12px;border-radius:14px;background:color-mix(in srgb, var(--c-ink) 8%, transparent);font-size:14.5px;line-height:1.35}
.c-opts b{font-weight:600}
.c-opts .rec{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;opacity:.7;margin-left:6px}
.c-opts span{display:block;opacity:.8}
.c-todos{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.c-todos label{display:flex;gap:12px;align-items:flex-start;min-height:44px;padding:10px 12px;border-radius:14px;background:color-mix(in srgb, var(--c-ink) 8%, transparent);font-size:15px;line-height:1.35;cursor:pointer}
.c-todos input{width:22px;height:22px;margin:0;flex:none;accent-color:var(--c-ink)}
.c-todos input:checked + span{text-decoration:line-through;opacity:.6}
.c-hint{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;opacity:.7;padding-top:6px}
.c-hint svg{width:14px;height:14px}

.stamp{position:absolute;top:22px;padding:6px 12px 7px;border:3px solid currentColor;border-radius:10px;background:var(--stamp-bg);opacity:0;pointer-events:none;z-index:3;max-width:62%}
.stamp b{display:block;font-family:var(--display);font-weight:800;font-size:28px;line-height:1;text-transform:uppercase;letter-spacing:.02em}
.stamp small{display:block;font-size:12px;font-weight:600;margin-top:4px;line-height:1.25}
.stamp-yes{left:18px;color:var(--yes);transform:rotate(-10deg);transform-origin:left top}
.stamp-later{right:18px;color:var(--later);transform:rotate(10deg);transform-origin:right top;text-align:right}
.t-important .stamp-yes{color:#B3261E}
:root[data-theme="dark"] .t-important .stamp-yes{color:#FF8A7A}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .t-important .stamp-yes{color:#FF8A7A} }
.wash{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:2}

.empty{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:8px 4px}
.empty h2{margin:0;font-family:var(--display);font-size:40px;line-height:1.05;letter-spacing:-.02em}
.empty p{margin:0;color:var(--muted);line-height:1.5}
.empty ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.empty li{font-size:14.5px}
.empty li span{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-right:8px}

/* mic dock */
.dock{height:132px;flex:none;display:grid;place-items:center;align-content:center;gap:6px;padding-bottom:6px}
.mic{width:84px;height:84px;border-radius:50%;border:0;background:var(--mic);color:var(--mic-ink);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow)}
.mic svg{width:34px;height:34px}
.mic:disabled{opacity:.35;cursor:default}
.dock small{font-size:12.5px;color:var(--muted)}

/* sheets */
.backdrop{position:absolute;inset:0;background:rgba(5,8,12,.42);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.backdrop.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;z-index:30;background:var(--surface);color:var(--fg);display:flex;flex-direction:column;max-height:88%;
  transition:transform .32s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px rgba(0,0,0,.18)}
.sheet.from-bottom{bottom:0;border-radius:26px 26px 0 0;transform:translateY(105%);padding-bottom:env(safe-area-inset-bottom, 0px)}
.sheet.from-top{top:0;border-radius:0 0 26px 26px;transform:translateY(-105%)}
.sheet.open{transform:none}
.grab{min-height:30px;display:grid;place-items:center;cursor:grab;touch-action:none;flex:none}
.grab span{width:44px;height:5px;border-radius:3px;background:var(--line)}
.sheet-in{padding:2px 22px 22px;overflow:auto;overscroll-behavior:contain;min-height:0}
.sheet .kind{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted);margin:0}
.sheet h3{margin:6px 0 16px;font-family:var(--display);font-size:24px;line-height:1.12;letter-spacing:-.01em;text-wrap:balance}
.example{border-radius:18px;padding:16px;background:var(--c-bg);color:var(--c-ink)}
.example p{margin:0;font-size:16.5px;line-height:1.45}
.eyebrow{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;margin:0 0 6px;opacity:.75}
.facts{margin:18px 0 0;display:grid;gap:14px}
.facts dt{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.facts dd{margin:3px 0 0;line-height:1.5}
.origin{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:4px;font-size:14px;color:var(--muted)}
.origin li{font-family:var(--mono);font-size:12.5px;overflow-wrap:anywhere}
.btn{min-height:48px;border-radius:14px;border:1px solid var(--line);background:transparent;padding:0 16px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn:disabled{opacity:.35;cursor:default}
.row{display:flex;gap:10px;margin-top:18px}
.row .btn{flex:1}

.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet-head > div{min-width:0}
.x{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:transparent;display:grid;place-items:center;cursor:pointer;flex:none;margin-top:-2px}
.x svg{width:18px;height:18px}
.send{width:60px;height:60px;border-radius:50%;border:0;background:var(--fg);color:var(--bg);display:grid;place-items:center;cursor:pointer;flex:none}
.send svg{width:26px;height:26px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:18px;height:18px;flex:none}
.hold{position:relative;overflow:hidden;width:100%;min-height:68px;margin-top:16px;border-radius:20px;border:2px solid var(--fg);background:transparent;color:var(--fg);
  display:flex;align-items:center;justify-content:center;gap:12px;font:700 22px var(--display);font-variant-numeric:tabular-nums;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer}
.hold .fill{position:absolute;inset:0;background:var(--important-bg);transform-origin:left center;transform:scaleX(0)}
.hold > :not(.fill){position:relative}
.hold svg{width:26px;height:26px}
.choice{display:grid;gap:10px}
.choice button{text-align:left;padding:14px 16px;border-radius:16px;border:1.5px solid var(--line);background:transparent;cursor:pointer;min-height:64px}
.choice button.rec{border-color:var(--fg);border-width:2px}
.choice b{display:block;font-size:17px}
.choice span{display:block;color:var(--muted);font-size:14px;margin-top:3px;line-height:1.35}
.choice em{font-style:normal;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;margin-left:8px;color:var(--yes)}

.confirm-in{width:100%;min-height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);font:500 18px var(--mono);padding:0 14px;margin-top:12px}
.lead{margin:0;line-height:1.5;color:var(--muted)}

.ov-total{font-family:var(--display);font-size:44px;font-weight:700;line-height:1;margin:2px 0 4px;font-variant-numeric:tabular-nums}
.ov-chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 18px}
.ov-chips span{font-size:13px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--c-bg);color:var(--c-ink)}
.ov-folders{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.ov-folders button{width:100%;display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:transparent;cursor:pointer;min-height:56px}
.ov-folders .f{font-family:var(--mono);font-size:14px;font-weight:500}
.ov-folders .n{font-weight:700;font-variant-numeric:tabular-nums;grid-row:span 2;align-self:center;font-size:20px}
.ov-folders .k{font-size:13px;color:var(--muted)}
.ov-working{margin-top:18px;font-size:13.5px;color:var(--muted);line-height:1.5}

.rec-wave{display:flex;gap:4px;align-items:center;justify-content:center;height:44px;margin:4px 0 10px}
.rec-wave i{width:5px;border-radius:3px;background:var(--rec);height:10px;animation:wave 0.9s ease-in-out infinite}
.rec-wave i:nth-child(2n){animation-delay:.15s}.rec-wave i:nth-child(3n){animation-delay:.3s}.rec-wave i:nth-child(5n){animation-delay:.45s}
@keyframes wave{50%{height:40px}}
.transcript{min-height:72px;font-size:19px;line-height:1.4;font-family:var(--display);font-weight:500}
.rec-time{font-variant-numeric:tabular-nums;color:var(--rec);font-weight:600;font-size:13px}

.listen-text{font-size:15.5px;line-height:1.55;max-height:30vh;overflow:auto}
.listen-text .said{color:var(--fg)} .listen-text .todo{color:var(--muted)}

.toast{position:absolute;left:50%;bottom:146px;transform:translate(-50%, 12px);opacity:0;transition:.22s;z-index:40;background:var(--fg);color:var(--bg);
  padding:10px 16px;border-radius:14px;font-size:14px;font-weight:500;max-width:calc(100% - 32px);width:max-content;pointer-events:none;text-align:center}
.toast.on{opacity:1;transform:translate(-50%, 0)}

.coach{position:absolute;inset:0;z-index:50;background:rgba(5,8,12,.78);color:#fff;display:flex;flex-direction:column;justify-content:center;gap:14px;
  padding-left:max(28px, env(safe-area-inset-left, 0px));padding-right:max(28px, env(safe-area-inset-right, 0px));cursor:pointer}
.coach h2{margin:0;font-family:var(--display);font-size:30px}
.coach ul{margin:0;padding:0;list-style:none;display:grid;gap:12px;font-size:16px}
.coach b{display:inline-block;min-width:92px;font-family:var(--display)}
.coach p{margin:0;opacity:.75;font-size:14px}

@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important} }
</style>

<div class="app" id="app">
  <header class="topbar">
    <button class="count" id="count" type="button" aria-label="Open the overview">
      <span id="countText">0 left</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <button class="iconbtn" id="listenBtn" type="button" aria-pressed="false" aria-label="Listen to this card">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 010 7"/><path d="M18.5 5.5a9 9 0 010 13"/></svg>
    </button>
  </header>
  <div class="banner" id="banner" hidden><span class="dot"></span><span id="bannerText"></span></div>

  <main class="stage" id="stage" aria-live="polite"></main>

  <div class="dock">
    <button class="mic" id="micBtn" type="button" aria-label="Change it: record a voice note for this session">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0"/><path d="M12 18v3"/></svg>
    </button>
    <small>Change it</small>
  </div>

  <div class="sr-only">
    <button type="button" id="srLater">Later</button>
    <button type="button" id="srYes">Agree</button>
    <button type="button" id="srDetails">Details</button>
  </div>

  <div class="backdrop" id="backdrop"></div>

  <section class="sheet from-top" id="ovSheet" aria-label="Overview" inert>
    <div class="sheet-in" id="ovBody"></div>
    <div class="grab" data-close="up"><span></span></div>
  </section>

  <section class="sheet from-bottom" id="detSheet" aria-label="Details" inert>
    <div class="grab" data-close="down"><span></span></div>
    <div class="sheet-in" id="detBody"></div>
  </section>

  <section class="sheet from-bottom" id="choiceSheet" aria-label="Choose an answer" inert>
    <div class="grab" data-close="down"><span></span></div>
    <div class="sheet-in" id="choiceBody"></div>
  </section>

  <section class="sheet from-bottom" id="confirmSheet" aria-label="Confirm" inert>
    <div class="grab" data-close="down"><span></span></div>
    <div class="sheet-in" id="confirmBody"></div>
  </section>

  <section class="sheet from-bottom" id="micSheet" aria-label="Voice note" inert>
    <div class="sheet-in" id="micBody"></div>
  </section>

  <section class="sheet from-bottom" id="listenSheet" aria-label="Listening" inert>
    <div class="grab" data-close="down"><span></span></div>
    <div class="sheet-in" id="listenBody"></div>
  </section>

  <div class="toast" id="toast" role="status"></div>

  <div class="coach" id="coach" role="dialog" aria-label="How it works">
    <h2>One card at a time</h2>
    <ul>
      <li><b>Drag right</b> do what the card says</li>
      <li><b>Drag left</b> later, it comes back</li>
      <li><b>Swipe up</b> the example and details</li>
      <li><b>Swipe down</b> what's waiting, by folder</li>
      <li><b>Mic</b> change it in your own words</li>
      <li><b>Speaker</b> listen to it</li>
    </ul>
    <p>Example cards. Nothing is sent anywhere. Tap to start.</p>
  </div>
</div>

<script>
const SEED = [
  { id:'csv', tone:'decision', kind:'Spec', session:'CSV export', folder:'quadsales', ago:'asked 12 min ago', affects:3,
    head:'Start building the CSV export, as specced',
    then:'Then 3 child sessions start: the button, the file builder and the tests.',
    yes:'Build it', yesSub:'Spec confirmed, building starts',
    detail:{ example:'On the Orders page you tap Export and get orders-2026-11.csv: one row per order, 14 columns, ready in under 3 seconds for 10,000 orders.',
      why:'You asked for monthly exports for the accountant. The spec is written and lists 6 checks the build must pass.',
      changes:'A new Export button on Orders, and a file in the layout your accountant\'s sheet already uses.',
      alt:'Use the mic to change the spec, for example "add VAT as its own column". It comes back rewritten.',

const $ = s => document.querySelector(s);
const stage = $('#stage');
let deck = [], g = null, busy = false, pending = false, timers = [], listening = false, micTimer = null;

const esc = s => String(s ?? '').replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

function reset(){
  timers.forEach(clearTimeout); timers = [];
  deck = SEED.map(c => ({...c, passed:false, revised:false, ticks: c.todos ? c.todos.map(() => false) : null}));
  SEED.forEach(c => KIND_TONE[c.kind] = c.tone);
  hideBanner(); render(true);
}

/* ---------- rendering ---------- */
function render(enter){
  if (g && g.axis) { pending = true; return; }
  stage.innerHTML = '';
  const n = deck.length;
  const allPassed = n > 0 && deck.every(c => c.passed);
  $('#countText').textContent = n ? `${n} left${allPassed ? ' · all passed once' : ''}` : 'All clear';
  $('#micBtn').disabled = !n; $('#listenBtn').disabled = !n;
  if (!n) { stage.appendChild(emptyEl()); return; }
  if (deck[1]) { const b = cardEl(deck[1]); b.classList.add('back'); b.setAttribute('aria-hidden','true'); stage.appendChild(b); }
  const t = cardEl(deck[0]); t.classList.add('top');
  if (enter) { t.classList.add('enter'); t.addEventListener('animationend', () => t.classList.remove('enter'), { once:true }); }
  stage.appendChild(t);
}

function cardEl(c){
  const el = document.createElement('article');
  el.className = `card t-${c.tone}`;

             : c.leftDrops ? ['Not now','Dropped. It stays in the summary']
             : ['Later','Comes back after the others'];
  const tags = [];
  if (c.affects) tags.push(`Unblocks ${c.affects} sessions`);
  if (c.revised) tags.push('Revised after your note');
  if (c.passed) tags.push('Passed earlier');
  el.innerHTML = `
    <div class="stamp stamp-yes"><b>${esc(c.yes)}</b><small>${esc(c.yesSub)}</small></div>
    <div class="stamp stamp-later"><b>${esc(left[0])}</b><small>${esc(left[1])}</small></div>

    <div class="c-who"><span>${esc(c.session)}</span><span class="folder">${esc(c.folder)}</span></div>
    ${tags.length ? `<div class="c-tags">${tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}
    <div class="c-body">
      <h2 class="c-head">${esc(c.head)}</h2>
      ${c.then ? `<p class="c-then">${esc(c.then)}</p>` : ''}
      ${c.options ? `<ul class="c-opts">${c.options.map(o => `<li><b>${esc(o.label)}</b>${o.rec ? '<span class="rec" style="display:inline">recommended</span>' : ''}<span>${esc(o.sub)}</span></li>`).join('')}</ul>` : ''}
      ${c.todos ? `<ul class="c-todos">${c.todos.map((t,i) => `<li><label><input type="checkbox" data-i="${i}" ${c.ticks[i] ? 'checked' : ''}><span>${esc(t)}</span></label></li>`).join('')}</ul>` : ''}

function emptyEl(){

/* ---------- card gestures ---------- */
const topCard = () => stage.querySelector('.card.top');

stage.addEventListener('pointerdown', e => {
  if (busy || !deck.length || e.button > 0) return;
  g = { id:e.pointerId, x:e.clientX, y:e.clientY, dx:0, dy:0, axis:null, lx:e.clientX, lt:performance.now(), vx:0, armed:0 };
});
stage.addEventListener('pointermove', e => {
  if (!g || e.pointerId !== g.id) return;
  g.dx = e.clientX - g.x; g.dy = e.clientY - g.y;
  if (!g.axis) {
    if (Math.hypot(g.dx, g.dy) < 9) return;
    g.axis = Math.abs(g.dx) > Math.abs(g.dy) ? 'x' : 'y';
    try { stage.setPointerCapture(g.id); } catch (err) {}
    const t = topCard(); if (t) { t.classList.remove('enter'); t.style.transition = 'none'; }
    stopListen();
  }
  const now = performance.now();
  g.vx = (e.clientX - g.lx) / Math.max(1, now - g.lt); g.lx = e.clientX; g.lt = now;
  if (g.axis === 'x') moveCard(g.dx); else nudge(g.dy);
});
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);

function threshold(){ return stage.clientWidth * 0.28; }

function moveCard(dx){
  const t = topCard(); if (!t) return;
  const c = deck[0];
  const blocked = c.noLeft && dx < 0;
  const x = blocked ? dx * 0.25 : dx;
  t.style.transform = `translateX(${x}px) rotate(${x / 20}deg)`;
  const p = Math.max(-1, Math.min(1, dx / threshold()));
  t.querySelector('.stamp-yes').style.opacity = Math.max(0, p);
  t.querySelector('.stamp-later').style.opacity = Math.max(0, -p);
  const wash = t.querySelector('.wash');
  wash.style.background = p > 0 ? 'var(--yes)' : 'var(--later)';
  wash.style.opacity = Math.abs(p) * 0.16;
  const b = stage.querySelector('.card.back');
  if (b) b.style.transform = `scale(${0.94 + 0.06 * Math.abs(p)}) translateY(${16 - 16 * Math.abs(p)}px)`;
  const armed = p >= 1 ? 1 : p <= -1 ? -1 : 0;
  if (armed !== g.armed) { if (armed && !blocked) buzz(12); g.armed = armed; }
}
function nudge(dy){ const t = topCard(); if (t) t.style.transform = `translateY(${dy * 0.18}px)`; }

function snapBack(){
  const t = topCard(); if (!t) return;
  t.style.transition = 'transform .3s cubic-bezier(.2,.9,.3,1.2)';
  t.style.transform = '';
  t.querySelectorAll('.stamp').forEach(s => { s.style.transition = 'opacity .2s'; s.style.opacity = 0; });
  t.querySelector('.wash').style.opacity = 0;
  const b = stage.querySelector('.card.back'); if (b) { b.style.transition = 'transform .3s'; b.style.transform = ''; }
}

function endDrag(e){
  if (!g || e.pointerId !== g.id) return;
  const { axis, dx, dy, vx } = g; g = null;
  if (pending) { pending = false; render(false); return; }
  if (!axis) return;
  if (axis === 'y') {
    snapBack();
    if (dy < -50) openDetails(); else if (dy > 50) openOverview();
    return;
  }
  const th = threshold(), c = deck[0];
  if (dx > th || (vx > 0.7 && dx > 40)) accept();
  else if (dx < -th || (vx < -0.7 && dx < -40)) {
    if (c.noLeft) { snapBack(); buzz([8,40,8]); toast('Nothing to dismiss here. Drag right once you\'ve read it.'); }
    else pass();
  }
  else snapBack();
}

function flyOut(dir, after){
  const t = topCard(); if (!t) { after(); return; }
  busy = true;
  t.style.transition = 'transform .32s ease-in, opacity .32s ease-in';
  if (dir === 'up') { t.style.transform = 'translateY(-115%) scale(.92)'; t.style.opacity = 0; }
  else {
    const w = stage.clientWidth * 1.4 * dir;
    t.style.transform = `translateX(${w}px) rotate(${dir * 26}deg)`;
    t.querySelector(dir > 0 ? '.stamp-yes' : '.stamp-later').style.opacity = 1;
  }
  setTimeout(() => { busy = false; after(); render(true); }, 320);
}

/* ---------- the moves ---------- */
function accept(){
  const c = deck[0];
  if (c.options) { snapBack(); openChoice(c); return; }
  if (c.important) { snapBack(); openConfirm(c); return; }
  buzz(18);
  flyOut(1, () => {
    deck.shift();
    const msg = c.todos ? `Sent to ${c.session}: all done.`
      : c.noLeft ? `Got it. ${c.session} is closed.`
      : c.tone === 'next' ? 'A new session is starting on your PC.'
      : c.tone === 'stopped' ? `${c.session} is restarting.`
      : `Sent to ${c.session}: ${c.yes.toLowerCase()}.`;
    toast(msg);
  });
}

function pass(){
  const c = deck[0];
  flyOut(-1, () => {
    deck.shift();
    if (c.leftDrops) { toast('Not now. Dropped from your deck.'); return; }
    c.passed = true;
    deck.push(c);
    toast(`Later. ${c.session} keeps waiting.`);
  });
}

function sendChoice(c, opt){
  closeSheets();
  buzz(18);
  setTimeout(() => flyOut(1, () => { deck.shift(); toast(`Sent to ${c.session}: ${opt.label.toLowerCase()}.`); }), 180);
}

function sendConfirmed(c){
  closeSheets();
  buzz([20,60,20]);
  setTimeout(() => flyOut(1, () => { deck.shift(); toast(`Merging PR #24. ${c.session} confirms when it's in.`); }), 180);
}

/* ---------- sheets ---------- */
const backdrop = $('#backdrop');
let openSheet = null, onSheetClose = null;
function showSheet(id, modal = true, onClose = null){
  if (listening) { try { speechSynthesis.cancel(); } catch (e) {} listening = false; $('#listenBtn').setAttribute('aria-pressed','false'); }
  closeSheets(true);
  const s = $(id);
  s.inert = false; s.classList.add('open'); openSheet = s; onSheetClose = onClose;
  if (modal) { backdrop.classList.add('on'); busy = true; $('#toast').classList.remove('on'); }
  return s;
}
let stopHold = null;
function closeSheets(silent){
  if (stopHold) { stopHold(); stopHold = null; }
  document.querySelectorAll('.sheet.open').forEach(s => { s.classList.remove('open'); s.inert = true; s.style.transform = ''; });
  backdrop.classList.remove('on'); busy = false;
  const cb = onSheetClose; openSheet = null; onSheetClose = null;
  if (cb && !silent) cb();
}
backdrop.addEventListener('click', () => closeSheets());

/* Drag a sheet back the way it came, from anywhere on it. A bottom sheet only takes the drag
   when its content is scrolled to the top, so scrolling the details still works. */
function sheetDrag(sheet){
  const dir = sheet.classList.contains('from-top') ? 'up' : 'down';
  const scroller = sheet.querySelector('.sheet-in');
  let y0 = null, x0 = 0, owned = false, d = 0, movedAt = 0;
  const atEdge = () => dir === 'down' ? scroller.scrollTop <= 0
    : scroller.scrollTop + scroller.clientHeight >= scroller.scrollHeight - 1;
  const start = (x, y, target) => {
    y0 = target.closest('.hold') ? null : y; x0 = x; owned = false; d = 0;
  };
  const move = (x, y, e) => {
    if (y0 === null) return;
    const dy = y - y0, dx = x - x0;
    if (!owned) {
      if (dy === 0 && Math.abs(dx) < 4) return;
      const closing = dir === 'down' ? dy > 0 : dy < 0;
      if (!closing || Math.abs(dx) > Math.abs(dy) || !atEdge()) { y0 = null; return; }
      owned = true; sheet.style.transition = 'none';
    }
    if (e.cancelable) e.preventDefault();
    d = dir === 'down' ? Math.max(0, dy) : Math.min(0, dy);
    if (Math.abs(d) > 6) movedAt = Date.now();
    sheet.style.transform = `translateY(${d}px)`;
  };
  const end = () => {
    if (owned) { sheet.style.transition = ''; if (Math.abs(d) > 80) closeSheets(); else sheet.style.transform = ''; }
    y0 = null; owned = false;
  };
  sheet.addEventListener('touchstart', e => start(e.touches[0].clientX, e.touches[0].clientY, e.target), { passive:true });
  sheet.addEventListener('touchmove', e => move(e.touches[0].clientX, e.touches[0].clientY, e), { passive:false });
  sheet.addEventListener('touchend', end);
  sheet.addEventListener('touchcancel', end);
  sheet.addEventListener('pointerdown', e => { if (e.pointerType === 'mouse') start(e.clientX, e.clientY, e.target); });
  window.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') move(e.clientX, e.clientY, e); });
  window.addEventListener('pointerup', e => { if (e.pointerType === 'mouse') end(); });
  sheet.addEventListener('click', e => { if (Date.now() - movedAt < 400) { e.stopPropagation(); e.preventDefault(); } }, true);
}
document.querySelectorAll('.sheet').forEach(sheetDrag);

function openOverview(){

  $('#ovBody').innerHTML = `
    <p class="kind" style="margin-top:16px">Waiting for you</p>
    <p class="ov-total">${deck.length} ${deck.length === 1 ? 'card' : 'cards'}</p>
    ${passed ? `<p class="lead">${passed} of them you passed once.</p>` : ''}
    <div class="ov-chips">${Object.entries(kinds).map(([k,n]) => `<span class="t-${KIND_TONE[k]}">${n} ${esc(k.toLowerCase())}</span>`).join('')}</div>
    <ul class="ov-folders">${Object.entries(groups).map(([f, cs]) => `
      <li><button type="button" data-f="${esc(f)}"><span class="f">${esc(f)}</span><span class="n">${cs.length}</span>
      <span class="k">${esc([...new Set(cs.map(c => c.kind))].join(', '))}</span></button></li>`).join('')}</ul>
    <p class="ov-working">Working now: ${WORKING.map(([f,s]) => `${esc(s)} <span style="font-family:var(--mono);font-size:12px">${esc(f)}</span>`).join(', ')}.</p>
    <p class="lead" style="margin-top:8px;font-size:13px">Tap a project to put all its cards first.</p>`;
  $('#ovBody').querySelectorAll('[data-f]').forEach(b => b.onclick = () => {
    const f = b.dataset.f;
    const first = deck.filter(c => c.folder === f);
    deck = [...first, ...deck.filter(c => c.folder !== f)];
    closeSheets(); render(true);
    toast(`${f} first: ${first.length} ${first.length === 1 ? 'card' : 'cards'}, then the rest.`);
  });
}

function openChoice(c){
  showSheet('#choiceSheet');
  $('#choiceBody').innerHTML = `
    ${sheetHead(`${c.session} · ${c.folder}`, c.head)}
    <div class="choice">${c.options.map((o,i) => `<button type="button" data-i="${i}" class="${o.rec ? 'rec' : ''}"><b>${esc(o.label)}${o.rec ? '<em>recommended</em>' : ''}</b><span>${esc(o.sub)}</span></button>`).join('')}</div>`;
  $('#choiceBody').querySelectorAll('[data-i]').forEach(b => b.onclick = () => sendChoice(c, c.options[+b.dataset.i]));
  setTimeout(() => $('#choiceBody .rec')?.focus({preventScroll:true}), 330);
}

const HOLD_MS = 3000;
function openConfirm(c){
  const secs = HOLD_MS / 1000;
  showSheet('#confirmSheet');
  $('#confirmBody').innerHTML = `
    ${sheetHead(`Important · ${c.session} · ${c.folder}`, c.head)}
    <p class="lead">${esc(c.detail?.risk || 'This is hard to take back.')}</p>
    <p class="lead" id="holdHint" style="margin-top:8px">Hold the arrow for ${secs} seconds. Let go to stop.</p>
    <button class="hold" type="button" id="holdBtn" aria-label="Hold for ${secs} seconds to confirm: ${esc(c.head)}">
      <span class="fill"></span>${ICON.send}<span class="num">${secs}</span>
    </button>`;
  holdToConfirm($('#holdBtn'), () => sendConfirmed(c));
}

function holdToConfirm(btn, onDone){
  const fill = btn.querySelector('.fill'), num = btn.querySelector('.num'), secs = HOLD_MS / 1000;
  let t0 = null, raf = 0, timer = 0;
  const paint = () => {
    if (t0 === null) return;
    const p = Math.min(1, (performance.now() - t0) / HOLD_MS);
    fill.style.transform = `scaleX(${p})`;
    num.textContent = Math.max(1, Math.ceil(secs * (1 - p)));
    raf = requestAnimationFrame(paint);
  };
  const start = e => {
    if (e) e.preventDefault();
    if (t0 !== null) return;
    t0 = performance.now(); buzz(10);
    fill.style.transition = 'none';
    raf = requestAnimationFrame(paint);
    timer = setTimeout(() => {
      t0 = null; cancelAnimationFrame(raf);
      fill.style.transform = 'scaleX(1)'; num.textContent = '';
      buzz([20, 60, 20]); stopHold = null; onDone();
    }, HOLD_MS);
  };
  const stop = () => {
    if (t0 === null) return;
    t0 = null; clearTimeout(timer); cancelAnimationFrame(raf);
    fill.style.transition = 'transform .25s'; fill.style.transform = 'scaleX(0)'; num.textContent = secs;
    const h = $('#holdHint'); if (h) h.textContent = `Keep holding for the full ${secs} seconds.`;
  };
  stopHold = stop;
  btn.addEventListener('pointerdown', e => { try { btn.setPointerCapture(e.pointerId); } catch (err) {} start(e); });
  btn.addEventListener('pointerup', stop);
  btn.addEventListener('pointercancel', stop);
  btn.addEventListener('contextmenu', e => e.preventDefault());
  btn.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) start(e); });
  btn.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') stop(); });
}

/* ---------- mic: change it ---------- */
function startMic(){
  if (!deck.length || busy) return;
  stopListen();
  const c = deck[0];
  const note = c.note || 'Keep it smaller. Do only the first part for now.';
  showSheet('#micSheet', true, () => clearInterval(micTimer));
  $('#micBody').innerHTML = `
    <div class="sheet-head" style="margin-top:16px"><p class="kind">Note for ${esc(c.session)} · <span class="rec-time" id="recTime">0:00</span></p>${closeBtn()}</div>
    <div class="rec-wave" aria-hidden="true">${'<i></i>'.repeat(14)}</div>
    <p class="transcript" id="transcript" aria-live="polite"></p>
    <div class="row" style="align-items:center;justify-content:space-between;gap:16px">
      <p class="lead" style="font-size:13px;margin:0">Example words. On your phone this is your own voice, written out by Android.</p>
      <button class="send" type="button" id="micSend" aria-label="Send to ${esc(c.session)}">${ICON.send}</button>
    </div>`;
  const words = note.split(' '); let i = 0, t0 = Date.now();
  clearInterval(micTimer);
  micTimer = setInterval(() => {
    const s = Math.floor((Date.now() - t0) / 1000);
    const rt = $('#recTime'); if (rt) rt.textContent = `0:${String(s).padStart(2,'0')}`;
    if (i < words.length) { $('#transcript').textContent = words.slice(0, ++i).join(' '); }
  }, 260);
  $('#micSend').onclick = () => sendNote(c, note);
}

function sendNote(c, note){
  closeSheets(true); clearInterval(micTimer); buzz(18);
  flyOut('up', () => {
    deck.shift();
    showBanner(`Note sent to ${c.session}. Waiting for its revised card…`, 'wait');
    timers.push(setTimeout(() => {
      const r = { ...c, ...(c.rev || { then: 'Changed after your note: it now does only the first part.' }),
        revised:true, passed:false, ago:'revised just now', rev:null, note:null };
      if (deck.length) deck.splice(1, 0, r); else deck.push(r);
      showBanner(`${c.session} sent its revised card. It's ${deck[0] === r ? 'here' : 'next'}.`, 'ok');
      timers.push(setTimeout(hideBanner, 4000));
      render(deck[0] === r);
    }, 6000));
  });
}

function showBanner(text, kind){ const b = $('#banner'); b.className = `banner ${kind}`; $('#bannerText').textContent = text; b.hidden = false; }
function hideBanner(){ $('#banner').hidden = true; }

/* ---------- listen ---------- */
function listenScript(c){
  if (c.listen) return c.listen;
  const d = c.detail || {};
  return [`From ${c.folder}, the ${c.session} session, ${c.ago}.`, `${c.head}.`, c.then,
    d.example ? `For example: ${d.example}` : '', d.risk ? `Risk: ${d.risk}` : '',
    c.options ? `The choices are: ${c.options.map(o => o.label + (o.rec ? ', which it recommends' : '')).join('; or ')}.` : '',
    c.todos ? `The things to do: ${c.todos.join('. ')}.` : ''].filter(Boolean).join(' ');
}

function startListen(){
  if (!deck.length) return;
  if (listening) { stopListen(); return; }
  const c = deck[0], text = listenScript(c);
  showSheet('#listenSheet', false, () => { try { speechSynthesis.cancel(); } catch (e) {} listening = false; $('#listenBtn').setAttribute('aria-pressed','false'); });
  $('#listenBody').innerHTML = `
    ${sheetHead(`Listening · ${c.session}`, '')}
    <p class="listen-text" id="listenText">${esc(text)}</p>
    <p class="lead" id="listenNote" style="font-size:13px"></p>`;
  listening = true; $('#listenBtn').setAttribute('aria-pressed','true');
  try {
    const u = new SpeechSynthesisUtterance(text);
    const voices = speechSynthesis.getVoices();
    const v = voices.find(v => /en[-_]GB/i.test(v.lang)) || voices.find(v => /^en/i.test(v.lang));
    if (v) u.voice = v;
    u.rate = 1.02;
    u.onboundary = ev => {
      if (ev.name && ev.name !== 'word') return;
      const i = ev.charIndex;
      $('#listenText').innerHTML = `<span class="said">${esc(text.slice(0, i))}</span><span class="todo">${esc(text.slice(i))}</span>`;
    };
    u.onend = () => { if (listening) stopListen(); };
    speechSynthesis.cancel(); speechSynthesis.speak(u);
    timers.push(setTimeout(() => { if (listening && !speechSynthesis.speaking) $('#listenNote').textContent = 'No sound? This view may block speech. The words above are what you would hear.'; }, 1500));
  } catch (e) {
    $('#listenNote').textContent = 'This view can\'t speak, so here are the words you would hear.';
  }
}
function stopListen(){ if (!listening) return; listening = false; closeSheets(); }

/* ---------- wiring ---------- */
$('#count').onclick = openOverview;
$('#listenBtn').onclick = startListen;
$('#micBtn').onclick = startMic;
$('#srLater').onclick = () => { if (deck.length && !busy) deck[0].noLeft ? toast('Nothing to dismiss here.') : pass(); };
$('#srYes').onclick = () => { if (deck.length && !busy) accept(); };
$('#srDetails').onclick = openDetails;

document.addEventListener('keydown', e => {
  if (e.target.matches('input')) { if (e.key === 'Escape') closeSheets(); return; }
  if (!$('#coach').hidden) { $('#coach').hidden = true; return; }
  if (e.key === 'Escape') { closeSheets(); return; }
  if (busy || !deck.length) return;
  if (e.key === 'ArrowRight') accept();
  else if (e.key === 'ArrowLeft') { deck[0].noLeft ? toast('Nothing to dismiss here.') : pass(); }
  else if (e.key === 'ArrowUp') openDetails();
  else if (e.key === 'ArrowDown') openOverview();
  else if (e.key.toLowerCase() === 'm') startMic();
  else if (e.key.toLowerCase() === 'l') startListen();
});

let toastT = null;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2400); }

$('#coach').addEventListener('click', () => { $('#coach').hidden = true; });
try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => {}; } catch (e) {}
reset();
</script>
